name = "kids-story-assets-api"
main = "src/index.ts"
compatibility_date = "2026-08-29"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175"
SUPABASE_URL = "https://aroereluxcehtjlnhcow.supabase.co"
SUPABASE_ADMIN_RPC = "is_admin"
MAX_IMAGE_BYTES = "10485760"
MAX_DELETE_KEYS = "25"

[[r2_buckets]]
binding = "STORY_ASSETS"
bucket_name = "kids-story-assets"
